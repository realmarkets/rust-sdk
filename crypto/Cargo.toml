[package]
name = "crypto"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish.workspace = true

[dependencies]
# `k256` brings EIP-191 hashing, address derivation and signature recovery for
# the Ethereum sign-in
alloy-primitives = { workspace = true, features = ["k256"] }
anyhow = { workspace = true }
bip39 = { workspace = true }
bs58 = { workspace = true }
hkdf = { workspace = true }
iota-sdk-crypto = { workspace = true, features = ["mnemonic"] }
iota-sdk-types = { workspace = true }
json = { workspace = true }
k256 = { workspace = true }
keyring = { workspace = true }
networks = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
