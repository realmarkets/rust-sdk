[workspace]
resolver = "3"

members = [
  "crypto",
  "dex",
  "indexer-api",
  "json",
  "keyring",
  "networks",
  "ptbs",
  "sdk",
  "tools/realacct",
  "types",
]

# inherited by members via `publish.workspace = true` (and `license.workspace = true`
# where a crate doesn't set its own); crates are not published to crates.io
[workspace.package]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# local crates
crypto = { path = "crypto" }
dex = { path = "dex" }
indexer-api = { path = "indexer-api" }
json = { path = "json" }
keyring = { path = "keyring" }
networks = { path = "networks" }
ptbs = { path = "ptbs" }
sdk = { path = "sdk" }
types = { path = "types" }

alloy-primitives = { version = "1.5.2", features = ["serde"] }
anyhow = "1.0"
base64 = "0.22.1"
base64-simd = "0.8.0"
bcs = "0.2.1"
# 3.x to share the copy iota-sdk-crypto's `mnemonic` feature pulls in
bip39 = { version = "3.0.0", features = ["zeroize"] }
# the version iota-sdk-types already depends on
bs58 = "0.5.1"
# keyring mirrors iota-keys' own key-derivation stack, version for version, so
# mnemonics, seeds and derived keys match it exactly; tiny-bip39 is the crate
# iota-keys imports as `bip39`, a different one from the `bip39` above
bip32 = "0.5.3"
tiny-bip39 = "1.0.0"
chrono = { version = "0.4.41", default-features = false, features = [
  "alloc",
  "serde",
] }
enum_dispatch = "0.3.13"
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "69d496c71fb37e3d22fe85e5bbfd4256d61422b9", version = "0.1.11" }
futures-util = "0.3"
hkdf = "0.12.4"
indexmap = "2.13.0"
iota-sdk-crypto = { version = "1.0.0-rc.1", default-features = false, features = [
  "bech32",
  "ed25519",
] }
iota-sdk-grpc-client = "1.0.0-rc.1"
iota-sdk-grpc-types = "1.0.0-rc.1"
iota-sdk-types = { version = "1.0.0-rc.1", features = ["hash", "serde"] }
# `sdk` is the only consumer and uses only `HttpClient`, `ClientT` and
# `rpc_params!`. The monorepo also enables `server`/`macros` for the sequencer's
# own RPC; asking for them here would pull jsonrpsee-server, the proc macros and
# the ws/wasm transports into every consumer's build for nothing.
jsonrpsee = { version = "0.26", default-features = false, features = [
  "http-client",
] }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
keccak-asm = "0.1.8"
rand = "0.10"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rust_decimal = { version = "1.39.0", features = ["maths"] }
rust_decimal_macros = "1.39.0"
serde = { version = "1.0.219", default-features = false, features = [
  "std",
  "derive",
  "rc",
] }
serde_json = "1.0.151"
serde_with = "3.23.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
signature = "1.6.4"
slip10_ed25519 = "0.1.3"
sonic-rs = "0.5.10"
tempfile = "3"
thiserror = "2.0.16"
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "time",
  "tracing",
  "sync",
  "rt",
] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1.41"
urlencoding = "2.1.3"
uuid = { version = "1.18.1", default-features = false, features = ["v4"] }
zeroize = "1.9.0"

[workspace.lints.clippy]
needless_return = "allow"
single_match = "allow"
enum_variant_names = "allow"
type_complexity = "allow"
from_over_into = "allow"
large_enum_variant = "allow"
collapsible_if = "allow"
unnecessary_sort_by = "allow"
too_many_arguments = "allow"
result_large_err = "allow"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
debug = 1
incremental = true
lto = false
codegen-units = 256

[profile.dev-fast]
inherits = "dev"
debug = false

# mirrors iota's own patch: fastcrypto-{tbls,vdf,zkp} pull their sibling from git,
# which must unify with the registry fastcrypto iota depends on
[patch."https://github.com/MystenLabs/fastcrypto"]
fastcrypto = "=0.1.11"
