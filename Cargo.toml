[workspace]
resolver = "3"

members = [
  "crypto",
  "dex",
  "indexer-api",
  "json",
  "networks",
  "ptbs",
  "sdk",
  "tools/realacct",
  "types",
]

# inherited by members via `publish.workspace = true` (and `license.workspace = true`
# where a crate doesn't set its own); crates are not published to crates.io
[workspace.package]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# local crates
crypto = { path = "crypto" }
dex = { path = "dex" }
indexer-api = { path = "indexer-api" }
json = { path = "json" }
networks = { path = "networks" }
ptbs = { path = "ptbs" }
sdk = { path = "sdk" }
types = { path = "types" }

anyhow = "1.0"
alloy-primitives = { version = "1.5.2", features = ["serde"] }
base64 = "0.22.1"
base64-simd = "0.8.0"
bcs = "0.1"
chrono = { version = "0.4.41", default-features = false, features = [
  "alloc",
  "serde",
] }
dashmap = "6.1.0"
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "69d496c71fb37e3d22fe85e5bbfd4256d61422b9", version = "0.1.11" }
futures-util = "0.3"
iota-json-rpc-api = { git = "https://github.com/iotaledger/iota.git", tag = "v1.32.0-beta" }
iota-json-rpc-types = { git = "https://github.com/iotaledger/iota.git", tag = "v1.32.0-beta" }
iota-keys = { git = "https://github.com/iotaledger/iota", tag = "v1.32.0-beta", package = "iota-keys", default-features = false }
iota-sdk = { git = "https://github.com/iotaledger/iota", tag = "v1.32.0-beta", package = "iota-sdk", default-features = false }
iota-sdk-crypto = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "8ae07b2897331e313b4231cafe1add6327511fa1", default-features = false, features = [
  "bech32",
  "ed25519",
] }
iota-types = { git = "https://github.com/iotaledger/iota.git", tag = "v1.32.0-beta", package = "iota-types", default-features = false }
# `sdk` is the only consumer and uses only `HttpClient`, `ClientT` and
# `rpc_params!`. The monorepo also enables `server`/`macros` for the sequencer's
# own RPC; asking for them here would pull jsonrpsee-server, the proc macros and
# the ws/wasm transports into every consumer's build for nothing.
jsonrpsee = { version = "0.26", default-features = false, features = [
  "http-client",
] }
keccak-asm = "0.1.8"
move-core-types = { git = "https://github.com/iotaledger/iota", tag = "v1.32.0-beta", package = "move-core-types", default-features = false }
rand = "0.10"
redb = "4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rust_decimal = { version = "1.39.0", features = ["maths"] }
rust_decimal_macros = "1.39.0"
rustc-hash = "2"
serde = { version = "1.0.219", default-features = false, features = [
  "std",
  "derive",
  "rc",
] }
serde_json = "1.0.151"
sonic-rs = "0.5.8"
sha3 = "0.10.8"
iota-sdk-types = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "8ae07b2897331e313b4231cafe1add6327511fa1", features = [
  "hash",
  "serde",
] }
thiserror = "2.0.16"
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "time",
  "tracing",
  "sync",
  "rt",
] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1.41"
urlencoding = "2.1.3"
uuid = { version = "1.18.1", default-features = false, features = ["v4"] }

[workspace.lints.clippy]
needless_return = "allow"
single_match = "allow"
enum_variant_names = "allow"
type_complexity = "allow"
from_over_into = "allow"
large_enum_variant = "allow"
collapsible_if = "allow"
unnecessary_sort_by = "allow"
too_many_arguments = "allow"
result_large_err = "allow"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
debug = 1
incremental = true
lto = false
codegen-units = 256

[profile.dev-fast]
inherits = "dev"
debug = false

# mirrors iota's own patch: fastcrypto-{tbls,vdf,zkp} pull their sibling from git,
# which must unify with the registry fastcrypto iota depends on
[patch."https://github.com/MystenLabs/fastcrypto"]
fastcrypto = "=0.1.11"
