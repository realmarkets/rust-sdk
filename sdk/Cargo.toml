[package]
name = "sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish.workspace = true

[features]
# opt in to the sonic-rs json backend; off by default, so the facade stays on
# serde_json. enabling it anywhere in a dependency graph flips every consumer of
# the shared facade at once (cargo feature unification).
sonic = ["json/sonic"]

[dependencies]
anyhow = { workspace = true }
crypto = { workspace = true }
jsonrpsee = { workspace = true }
json = { workspace = true }
networks = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
types = { workspace = true, features = ["crypto_support"] }

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true
