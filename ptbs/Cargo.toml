[package]
name = "ptbs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish.workspace = true

[dependencies]
alloy-primitives = { workspace = true }
anyhow = { workspace = true }
bcs = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
iota-sdk-grpc-client = { workspace = true }
iota-sdk-grpc-types = { workspace = true }
iota-sdk-types = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
types = { workspace = true }

[features]
# grpc::mock_node, for crates that test against a fullnode served from memory
test-helpers = ["tokio/net"]

[dev-dependencies]
tokio = { workspace = true, features = ["net", "test-util"] }

[lints]
workspace = true
